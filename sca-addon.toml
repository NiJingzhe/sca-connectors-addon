[addon]
name = "sca-connectors-addon"
version = "0.6.1"
license = "Apache-2.0"
skill_path = "skill"

[compat]
# [runtime].command_prefix and 'sca addon use' first shipped in SDK 2.1.3b3.
sca = ">=2.1.3b3,<3"

[runtime]
kind = "python-env"
platforms = ["macos-arm64", "macos-x86_64", "linux-x86_64", "linux-aarch64"]
check_cmd = "python3 -c 'import connverify, gmsh, numpy, simplecadapi' 2>/dev/null || python -c 'import connverify, gmsh, numpy, simplecadapi'"
# Prefer the interpreter provisioned inside the addon home; fall through to
# the caller's PATH when it is absent (see README "Runtime provisioning").
command_prefix = 'PATH="{addon_dir}/.venv/bin:$PATH"'
